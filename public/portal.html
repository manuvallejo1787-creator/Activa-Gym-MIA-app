<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mi Entrenamiento</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{--pri:#CC0000;--bg:#1A1A1A}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#fff;min-height:100vh;padding-bottom:40px}
  .hdr{background:linear-gradient(135deg,var(--pri),var(--bg));padding:18px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px rgba(0,0,0,.4);display:flex;align-items:center;gap:12px}
  .hdr img{height:36px;width:36px;object-fit:contain;border-radius:8px;background:rgba(255,255,255,.1);flex-shrink:0}
  .hdr h1{font-size:17px;font-weight:900;letter-spacing:1.5px}
  .hdr .sub{font-size:10px;opacity:.85;letter-spacing:2.5px;margin-top:1px}
  .hdr .cli{font-size:12px;margin-top:6px;font-weight:600}
  .fasebadge{display:inline-block;background:rgba(255,255,255,.18);border-radius:99px;padding:2px 9px;font-size:9px;font-weight:800;letter-spacing:.5px;margin-top:4px}
  .wrap{padding:14px 12px;max-width:560px;margin:0 auto}

  .card{background:#242424;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #333}
  .card h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--pri);font-weight:800;margin-bottom:10px}

  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}
  .cal .dow{font-size:8px;color:#777;text-align:center;font-weight:700;padding-bottom:2px}
  .cal .day{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:#1A1A1A;color:#555;border:1px solid #2e2e2e}
  .cal .day.trained{background:var(--pri);color:#fff;border-color:var(--pri)}
  .cal .day.today{box-shadow:0 0 0 2px #fff inset}
  .cal .day.empty{visibility:hidden}
  .dashrow{display:flex;gap:8px;margin-bottom:2px}
  .stat{flex:1;background:#1A1A1A;border-radius:8px;padding:10px;text-align:center}
  .stat .n{font-size:20px;font-weight:900}
  .stat .l{font-size:9px;color:#999;text-transform:uppercase;letter-spacing:.3px;margin-top:2px}

  .mejora{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #2e2e2e;font-size:12px}
  .mejora:last-child{border-bottom:none}
  .mejora .val{font-weight:800;color:#16A34A}

  .crit{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:12px;border-bottom:1px solid #2e2e2e}
  .crit:last-child{border-bottom:none}
  .crit .chk{flex-shrink:0;width:16px;height:16px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;margin-top:1px}
  .crit .chk.on{background:#16A34A;color:#fff}
  .crit .chk.off{background:#3a3a3a;border:1px solid #555;color:transparent}
  .crit.done span.txt{color:#888;text-decoration:line-through}

  .planname{font-size:15px;font-weight:800;margin-bottom:2px}
  .planmeta{font-size:11px;color:#aaa;margin-bottom:12px}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
  .tab{flex:0 0 auto;background:#2a2a2a;color:#ccc;border:1px solid #3a3a3a;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
  .blk{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--pri);font-weight:800;margin:14px 0 6px}
  .ex{background:#242424;border-radius:10px;margin-bottom:8px;border:1px solid #333;overflow:hidden}
  .exhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;cursor:pointer;user-select:none}
  .exhead:active{background:#2c2c2c}
  .exhead-l{display:flex;align-items:center;gap:9px;min-width:0}
  .exthumb{width:38px;height:38px;border-radius:7px;object-fit:cover;flex-shrink:0;background:#1a1a1a}
  .exhead .nm{font-size:14px;font-weight:800;line-height:1.2}
  .arrow{color:var(--pri);font-size:12px;flex-shrink:0;width:12px;text-align:center;transition:transform .15s}
  .exdone{background:#16A34A;color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:2px 9px;white-space:nowrap;flex-shrink:0}
  .exnone{color:#777;font-size:10px;white-space:nowrap;flex-shrink:0}
  .exbody{padding:0 12px 12px}
  .exmedia{margin-bottom:10px;border-radius:8px;overflow:hidden;background:#000}
  .exmedia img{width:100%;display:block;max-height:220px;object-fit:cover}
  .exmedia iframe{width:100%;aspect-ratio:16/9;border:none;display:block}
  .exmediadesc{font-size:10px;color:#999;padding:6px 2px 0}
  .exbody .pr{font-size:11px;color:#999;margin-bottom:8px}
  .pr .sug{color:#B794F6;font-weight:800}
  .grid{display:flex;flex-direction:column;gap:5px}
  .wk{display:flex;align-items:center;gap:8px}
  .wk .lbl{flex:0 0 58px;font-size:11px;color:#888;font-weight:700}
  .wk input{flex:1;min-width:0;background:#1A1A1A;border:1px solid #3a3a3a;border-radius:6px;color:#fff;padding:8px 9px;font-size:14px;outline:none}
  .wk input:focus{border-color:var(--pri)}
  .wk input.saved{border-color:#16A34A}
  .wk .u{font-size:10px;color:#777;flex:0 0 auto}
  .msg{text-align:center;padding:40px 20px;color:#aaa;font-size:14px;line-height:1.6}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#16A34A;color:#fff;padding:8px 18px;border-radius:99px;font-size:13px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}
  .foot{text-align:center;font-size:10px;color:#666;margin-top:20px;letter-spacing:1px}
</style>
</head>
<body>
  <div class="hdr" id="hdr">
    <div>
      <h1 id="gymname">ACTIVA</h1>
      <div class="sub" id="gymsub">FITNESS CLUB</div>
      <div class="cli" id="cli"></div>
      <div id="fasebadge"></div>
    </div>
  </div>
  <div class="wrap" id="wrap">
    <div class="msg" id="msg">Cargando tu entrenamiento…</div>
  </div>
  <div class="toast" id="toast">Guardado ✓</div>

<script>
const SEMANAS = 8;
const params = new URLSearchParams(location.search);
const TOKEN = params.get('t') || params.get('token') || '';
let DATA = null;
let LOGMAP = {};
let activeDia = 0;

const $ = id => document.getElementById(id);
const key = (d,e,s) => `${d}|${e}|${s}`;

const FASE_LABEL = {restaura:'RESTAURA · Rehabilitación', activa:'ACTIVA · Base de movimiento', potencia:'POTENCIA · Desarrollo de capacidades', rinde:'RINDE · Alto rendimiento'};

function toast(txt, ok){
  const t = $('toast');
  t.textContent = txt; t.style.background = ok===false ? '#CC0000' : '#16A34A';
  t.classList.add('show'); clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 1400);
}

async function cargar(){
  if(!TOKEN){ $('msg').textContent = 'Link inválido. Pedile a tu entrenador el enlace de tu portal.'; return; }
  try{
    const r = await fetch('/api/portal?token=' + encodeURIComponent(TOKEN));
    let body = null;
    try { body = await r.json(); } catch {}
    if(r.status === 403){ $('msg').textContent = 'Acceso no válido. Revisá el link con tu entrenador.'; return; }
    if(!r.ok){ $('msg').textContent = 'Error del servidor: ' + ((body && body.error) || ('HTTP ' + r.status)) + '. Avisale a tu entrenador.'; return; }
    DATA = body;
    aplicarMarca();
    $('cli').textContent = DATA.cliente ? `Hola, ${DATA.cliente.nombre} 💪` : '';
    if(DATA.cliente && DATA.cliente.nivel && FASE_LABEL[DATA.cliente.nivel]){
      $('fasebadge').innerHTML = `<span class="fasebadge">${FASE_LABEL[DATA.cliente.nivel]}</span>`;
    }
    LOGMAP = {};
    (DATA.logs||[]).forEach(l => { LOGMAP[key(l.dia_id, l.ejercicio_id, l.semana)] = l; });
    render();
  }catch(e){ $('msg').textContent = 'No se pudo conectar (' + (e.message||'red') + '). Revisá tu internet y probá de nuevo.'; }
}

function aplicarMarca(){
  const b = DATA.brand;
  if(!b) return;
  if(b.color_primary) document.documentElement.style.setProperty('--pri', b.color_primary);
  if(b.color_bg) document.documentElement.style.setProperty('--bg', b.color_bg);
  if(b.gym_name) $('gymname').textContent = b.gym_name;
  if(b.gym_sub) $('gymsub').textContent = b.gym_sub;
  if(b.logo_img){
    const img = document.createElement('img');
    img.src = b.logo_img;
    $('hdr').insertBefore(img, $('hdr').firstChild);
  }
}

function diasEntrenadosMes(){
  const hoy = new Date();
  const set = new Set();
  (DATA.logs||[]).forEach(l=>{
    if(!l.updated_at) return;
    const d = new Date(l.updated_at);
    if(d.getFullYear()===hoy.getFullYear() && d.getMonth()===hoy.getMonth()) set.add(d.getDate());
  });
  return set;
}

function sesionesCompletasVsIncompletas(){
  if(!DATA.plan) return {completas:0, incompletas:0};
  const dias = (DATA.plan.dias||[]).filter(d=>d.obj);
  let completas=0, incompletas=0;
  dias.forEach(d=>{
    const totalEx = (d.blocks||[]).reduce((n,b)=>n+(b.exercises||[]).length,0);
    if(!totalEx) return;
    for(let s=1;s<=SEMANAS;s++){
      let hechos=0;
      (d.blocks||[]).forEach(b=>(b.exercises||[]).forEach(be=>{
        const lg = LOGMAP[key(d.id,be.exId,s)];
        if(lg && ((lg.peso_real!=null&&lg.peso_real!=='')||lg.reps_real)) hechos++;
      }));
      if(hechos===0) continue;
      if(hechos>=totalEx) completas++; else incompletas++;
    }
  });
  return {completas, incompletas};
}

function topMejoras(){
  if(!DATA.plan) return [];
  const porEj = {};
  (DATA.logs||[]).forEach(l=>{
    const p = parseFloat(l.peso_real);
    if(isNaN(p)) return;
    (porEj[l.ejercicio_id] = porEj[l.ejercicio_id]||[]).push({semana:l.semana, peso:p});
  });
  const mejoras = [];
  Object.entries(porEj).forEach(([exId, arr])=>{
    if(arr.length<2) return;
    arr.sort((a,b)=>a.semana-b.semana);
    const ini = arr[0].peso, fin = arr[arr.length-1].peso;
    const delta = fin-ini;
    if(delta>0) mejoras.push({exId, nombre: DATA.nombres[exId]||exId, ini, fin, delta});
  });
  mejoras.sort((a,b)=>b.delta-a.delta);
  return mejoras.slice(0,4);
}

function renderDashboard(){
  const hoy = new Date();
  const primerDiaSemana = new Date(hoy.getFullYear(), hoy.getMonth(), 1).getDay();
  const diasEnMes = new Date(hoy.getFullYear(), hoy.getMonth()+1, 0).getDate();
  const entrenados = diasEntrenadosMes();
  const {completas, incompletas} = sesionesCompletasVsIncompletas();
  const mejoras = topMejoras();

  let cal = `<div class="cal">`;
  ['D','L','M','M','J','V','S'].forEach(d=>cal+=`<div class="dow">${d}</div>`);
  for(let i=0;i<primerDiaSemana;i++) cal += `<div class="day empty"></div>`;
  for(let d=1;d<=diasEnMes;d++){
    const cls = ['day'];
    if(entrenados.has(d)) cls.push('trained');
    if(d===hoy.getDate()) cls.push('today');
    cal += `<div class="${cls.join(' ')}">${d}</div>`;
  }
  cal += `</div>`;

  let html = `<div class="card"><h3>📅 Este mes</h3>${cal}`;
  html += `<div class="dashrow">
    <div class="stat"><div class="n">${entrenados.size}</div><div class="l">Días entrenados</div></div>
    <div class="stat"><div class="n" style="color:#16A34A">${completas}</div><div class="l">Completos</div></div>
    <div class="stat"><div class="n" style="color:#D97706">${incompletas}</div><div class="l">Incompletos</div></div>
  </div></div>`;

  if(mejoras.length){
    html += `<div class="card"><h3>📈 Tus mejoras</h3>`;
    mejoras.forEach(m=>{
      html += `<div class="mejora"><span>${esc(m.nombre)}</span><span class="val">${m.ini}kg → ${m.fin}kg (+${(m.delta).toFixed(1)})</span></div>`;
    });
    html += `</div>`;
  }

  if(DATA.criterios && DATA.criterios.length){
    const estado = DATA.cliente.criteriosEstado||{};
    html += `<div class="card"><h3>🎯 Requisitos para tu próxima fase</h3>`;
    DATA.criterios.forEach(c=>{
      const on = !!estado[c.id];
      html += `<div class="crit ${on?'done':''}"><span class="chk ${on?'on':'off'}">${on?'✓':''}</span><span class="txt">${esc(c.texto)}</span></div>`;
    });
    html += `<div style="font-size:10px;color:#777;margin-top:8px">Esto lo marca tu entrenador cuando lo evalúa — no se edita desde acá.</div></div>`;
  }

  return html;
}

function esYoutube(url){ return url && (url.includes('youtube')||url.includes('youtu.be')); }
function getYTEmbed(url){
  const m = (url||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([^&\s]+)/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : null;
}

function render(){
  const plan = DATA.plan;
  let html = renderDashboard();

  if(!plan){ html += '<div class="msg">Todavía no tenés un plan activo asignado.<br>Tu entrenador lo va a publicar pronto.</div>'; $('wrap').innerHTML = html; return; }
  const dias = (plan.dias||[]).filter(d => d.obj && (d.blocks||[]).some(b => (b.exercises||[]).length));
  if(!dias.length){ html += '<div class="msg">Tu plan todavía no tiene ejercicios cargados.</div>'; $('wrap').innerHTML = html; return; }
  if(activeDia >= dias.length) activeDia = 0;

  html += `<div class="planname">${esc(plan.nombre||'Mi plan')}</div>`;
  html += `<div class="planmeta">${plan.fecha_inicio?('Desde '+plan.fecha_inicio):''}${plan.fecha_fin_estimada?(' · hasta '+plan.fecha_fin_estimada):''} · ${dias.length} día/s por semana</div>`;

  html += `<div class="tabs">` + dias.map((d,i)=>
    `<div class="tab ${i===activeDia?'on':''}" onclick="setDia(${i})">${esc(d.name||('Día '+(i+1)))}</div>`
  ).join('') + `</div>`;

  const d = dias[activeDia];
  (d.blocks||[]).forEach(b=>{
    const exs = b.exercises||[];
    if(!exs.length) return;
    html += `<div class="blk">${esc(b.type||'')}</div>`;
    exs.forEach((be,exj)=>{
      const nombre = (DATA.nombres && DATA.nombres[be.exId]) || be.exId;
      const med = (DATA.media && DATA.media[be.exId]) || null;
      const p = be.params || b.params || {};
      const GC={A:'#7C3AED',B:'#0891B2',C:'#DB2777',D:'#CA8A04'};
      const GL={bi:'Biserie',tri:'Triserie',circuito:'Circuito'};
      const gtag = be.grupo ? `<span style="background:${GC[be.grupo.id]||'#7C3AED'};color:#fff;font-size:9px;font-weight:800;border-radius:99px;padding:1px 7px;margin-right:5px;">🔗 ${GL[be.grupo.tipo]||''} ${be.grupo.id}</span>` : '';
      const uid = `${d.id}_${be.exId}_${exj}`.replace(/[^a-zA-Z0-9_]/g,'');
      let filled=0;
      for(let s=1;s<=SEMANAS;s++){const lg=LOGMAP[key(d.id,be.exId,s)]||{}; if((lg.peso_real!=null&&lg.peso_real!=='')||lg.reps_real)filled++;}
      const estado = filled>0 ? `<span class="exdone">✓ ${filled}/${SEMANAS}</span>` : `<span class="exnone">${SEMANAS} sem.</span>`;
      const thumb = med && med.tipo!=='video' ? `<img class="exthumb" src="${esc(med.url)}" onerror="this.style.display='none'"/>` : '';
      const pesoSugTxt = (be.pesoSug!=null && be.pesoSug!=='') ? ` · <span class="sug">💡 sugerido ${esc(be.pesoSug)} kg</span>` : '';
      let mediaHtml = '';
      if(med){
        if(med.tipo==='video' || esYoutube(med.url)){
          const emb = getYTEmbed(med.url);
          mediaHtml = emb ? `<div class="exmedia"><iframe src="${emb}" allowfullscreen title="video"></iframe></div>` : '';
        } else {
          mediaHtml = `<div class="exmedia"><img src="${esc(med.url)}" onerror="this.parentElement.style.display='none'"/></div>`;
        }
        if(med.desc) mediaHtml += `<div class="exmediadesc">${esc(med.desc)}</div>`;
      }
      let body = mediaHtml + `<div class="pr">Prescripción: ${esc((p.series||'?')+' × '+(p.reps||'?'))}${p.descanso?(' · desc '+esc(p.descanso)):''}${pesoSugTxt}</div><div class="grid">`;
      for(let s=1;s<=SEMANAS;s++){
        const lg = LOGMAP[key(d.id, be.exId, s)] || {};
        const peso = (lg.peso_real ?? '') === null ? '' : (lg.peso_real ?? '');
        const reps = lg.reps_real ?? '';
        body += `<div class="wk"><span class="lbl">Sem ${s}</span>`+
          `<input inputmode="decimal" placeholder="kg" value="${esc(peso)}" onblur="guardar(this,'${d.id}','${esc(d.name||'')}','${be.exId}','${escAttr(nombre)}',${s},'peso')"><span class="u">kg</span>`+
          `<input inputmode="numeric" placeholder="reps" value="${esc(reps)}" onblur="guardar(this,'${d.id}','${esc(d.name||'')}','${be.exId}','${escAttr(nombre)}',${s},'reps')"><span class="u">reps</span>`+
          `</div>`;
      }
      body += `</div>`;
      html += `<div class="ex">`+
        `<div class="exhead" onclick="toggleEx('${uid}')">`+
          `<div class="exhead-l">${thumb}<span class="arrow" id="arr_${uid}">▸</span><span class="nm">${gtag}${esc(nombre)}</span></div>`+
          `<div class="exhead-r">${estado}</div>`+
        `</div>`+
        `<div class="exbody" id="body_${uid}" style="display:none;">${body}</div>`+
      `</div>`;
    });
  });
  html += `<div class="foot">${(DATA.brand&&DATA.brand.gym_name)||'ACTIVA'} · Tus datos se guardan automáticamente</div>`;
  $('wrap').innerHTML = html;
}

window.setDia = i => { activeDia = i; render(); };

window.toggleEx = (uid) => {
  const b = document.getElementById('body_'+uid), a = document.getElementById('arr_'+uid);
  if(!b) return;
  const willOpen = (b.style.display === 'none');
  b.style.display = willOpen ? 'block' : 'none';
  if(a) a.textContent = willOpen ? '▾' : '▸';
};

window.guardar = async (inp, dia_id, dia_nombre, ejercicio_id, ejercicio_nombre, semana, campo) => {
  const k = key(dia_id, ejercicio_id, semana);
  const prev = LOGMAP[k] || {};
  const payload = {
    token: TOKEN, plan_id: DATA.plan.id, dia_id, dia_nombre, ejercicio_id, ejercicio_nombre, semana,
    peso_real: campo==='peso' ? inp.value.trim() : (prev.peso_real ?? ''),
    reps_real: campo==='reps' ? inp.value.trim() : (prev.reps_real ?? ''),
  };
  if(payload.peso_real==='' && payload.reps_real==='' && !prev.peso_real && !prev.reps_real) return;
  try{
    const r = await fetch('/api/portal', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    if(!r.ok) throw new Error();
    const nuevo = { ...prev, peso_real: payload.peso_real==='' ? null : payload.peso_real, reps_real: payload.reps_real, updated_at: new Date().toISOString() };
    LOGMAP[k] = nuevo;
    (DATA.logs = DATA.logs||[]).push({ dia_id, ejercicio_id, semana, ...nuevo });
    inp.classList.add('saved'); setTimeout(()=>inp.classList.remove('saved'), 1200);
    toast('Guardado ✓', true);
  }catch(e){ toast('No se pudo guardar', false); }
};

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escAttr(s){ return esc(s).replace(/'/g,"\\'"); }

cargar();
</script>
</body>
</html>
